<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>菌落触手战</title>
<meta name="description" content="触手战争式的微生物策略游戏：伸出触手、切断触手、占领培养皿。含原版 20 关、第二章异变关卡、无尽进化模式与关卡编辑器。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="rotateHint"><svg viewBox="0 0 16 16"><rect x="4.5" y="1.5" width="7" height="13" rx="1.5"/><path d="M1.5 9.5a6.5 6.5 0 0 0 4 4.5M14.5 6.5a6.5 6.5 0 0 0-4-4.5"/></svg>把手机横过来玩，培养皿会更大</div>
  <div id="stage">
    <canvas id="cv" width="640" height="480"></canvas>
    <div id="ui">

      <!-- home: mode select -->
      <div id="home" class="layer">
        <div class="title"><h1>菌落触手战</h1><p>Colony · Tendrils</p></div>
        <div class="modes">
          <button class="mode" id="mCh1" type="button"><b>经典战役</b><i>原版 20 个区域，<br>规则与关卡完整复刻</i><em id="pCh1">已占领 0 / 20</em></button>
          <button class="mode" id="mCh2" type="button"><span class="tag">新</span><b>第二章 · 异变</b><i>增幅器、甲壳、毒囊、汲取者、<br>游走微生物与移动之墙</i><em id="pCh2">已占领 0 / 10</em></button>
          <button class="mode" id="mEndless" type="button"><span class="tag">新</span><b>无尽进化</b><i>随机生成的培养皿，<br>每过一层三选一突变</i><em id="pEndless">还没有记录</em></button>
          <button class="mode" id="mEditor" type="button"><span class="tag">新</span><b>关卡编辑器</b><i>摆放微生物和墙，<br>生成分享码发给朋友</i><em id="pEditor">打开上次的草稿</em></button>
          <button class="mode wide" id="mLobby" type="button"><span class="tag">新</span><b>关卡大厅</b><i>挑战其他玩家设计的关卡，也可以把你的作品上传给大家玩</i><em id="pLobby">正在连接…</em></button>
        </div>
        <div class="homeRow">
          <button class="btn small" id="mImport" type="button">输入分享码</button>
          <button class="btn small" id="mHelp" type="button">玩法说明</button>
        </div>
        <div class="tools"><button class="ibtn" data-toggle="sound" type="button" title="音效"></button><button class="ibtn" data-toggle="music" type="button" title="音乐"></button></div>
      </div>

      <!-- campaign: zone ring -->
      <div id="campaign" class="layer hidden">
        <button class="ibtn back" id="cBack" type="button"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4"/></svg>返回</button>
        <div class="head"><h1 id="cTitle">经典战役</h1></div>
        <div class="tabs"><button class="tab" id="tab1" type="button">第一章 · 原版</button><button class="tab" id="tab2" type="button">第二章 · 异变</button></div>
        <div id="zones"></div>
        <div class="center">
          <div class="score">总积分<b id="scoreVal">0</b></div>
          <div id="zoneName"></div>
          <button class="btn primary" id="btnContinue" type="button">开始</button>
        </div>
        <div class="tools"><button class="ibtn" data-toggle="sound" type="button" title="音效"></button><button class="ibtn" data-toggle="music" type="button" title="音乐"></button></div>
      </div>

      <!-- level lobby -->
      <div id="lobby" class="layer hidden">
        <button class="ibtn back" id="lBack" type="button"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4"/></svg>返回</button>
        <div class="head"><h1>关卡大厅</h1></div>
        <div class="tools"><button class="ibtn primary" id="lCreate" type="button">设计并上传</button></div>
        <div class="lBar">
          <div class="tabs" id="lTabs"><button class="tab" data-s="new" type="button">最新</button><button class="tab" data-s="hot" type="button">最热</button><button class="tab" data-s="top" type="button">好评</button><button class="tab" data-s="mine" type="button">我的上传</button></div>
          <input id="lQ" type="search" maxlength="24" placeholder="搜索关卡名或作者" autocomplete="off">
        </div>
        <div id="lList"></div>
        <div id="lState" class="hidden"></div>
      </div>

      <!-- in-game HUD -->
      <div id="hud" class="layer hidden">
        <div id="hudTop"><span id="hLabel">区域 <b>1</b></span><span>能量上限 <b id="hMax">60</b></span><span class="grow"></span><span>时间 <b id="hTime">0</b></span><div id="occ" title="各阵营能量占比"></div></div>
        <div id="chips"></div>
        <div id="tutors"></div>
        <div id="status"></div>
        <div id="tip" class="hidden"></div>
        <div id="hudBottom">
          <button class="ibtn" id="bMenu" type="button" title="返回 (Esc)"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4"/></svg><span id="bMenuTxt">菜单</span></button>
          <button class="ibtn" id="bRestart" type="button" title="重新开始 (R)"><svg viewBox="0 0 12 12"><path d="M2.5 6a3.5 3.5 0 1 0 1.1-2.6"/><path d="M2.6 1.6v2.3h2.3"/></svg>重来</button>
          <button class="ibtn" id="bPause" type="button" title="暂停 (P / 空格)"></button>
          <span class="grow"></span>
          <button class="ibtn" id="bSpeed" type="button" title="游戏速度">1×</button>
          <button class="ibtn" data-toggle="sound" type="button" title="音效"></button>
          <button class="ibtn" data-toggle="music" type="button" title="音乐"></button>
          <button class="ibtn" id="bHelp" type="button" title="玩法说明">?</button>
        </div>
      </div>

      <!-- level editor -->
      <div id="editor" class="layer hidden">
        <div id="edTop"><span class="ttl">关卡编辑器</span><input id="edName" type="text" maxlength="24" placeholder="给关卡起个名字" autocomplete="off"><span class="grow"></span><span class="cnt" id="edCount"></span></div>
        <div id="edPanel">
          <div class="head"><span id="edPanelTitle">画笔</span><button class="ibtn" id="edCollapse" type="button">收起</button></div>
          <div class="body">
            <div class="seg" id="edTool"><button type="button" data-v="cell">放微生物</button><button type="button" data-v="wall">画墙</button></div>
            <div id="secCell" class="body">
              <label>阵营</label><div class="swatches" id="edTeam"></div>
              <label>类型</label><div class="seg" id="edKind"></div>
              <label>能量 <b id="edPow">30</b></label>
              <div class="seg" id="edPowBtns"><button type="button" data-v="-10">−10</button><button type="button" data-v="-1">−1</button><button type="button" data-v="1">+1</button><button type="button" data-v="10">+10</button></div>
              <label>游走</label><div class="seg" id="edCMove"><button type="button" data-v="0">静止</button><button type="button" data-v="1">横向</button><button type="button" data-v="2">纵向</button></div>
            </div>
            <div id="secWall" class="body hidden">
              <label>移动</label><div class="seg" id="edWMove"><button type="button" data-v="0">静止</button><button type="button" data-v="1">横向</button><button type="button" data-v="2">纵向</button></div>
            </div>
            <button class="btn small danger hidden" id="edDelete" type="button">删除选中 (Del)</button>
            <p class="hint" id="edHint"></p>
          </div>
        </div>
        <div id="edMsg"></div>
        <div id="edBottom">
          <button class="ibtn" id="edBack" type="button"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4"/></svg>返回</button>
          <button class="ibtn" id="edMax" type="button" title="所有微生物的能量上限">上限 100</button>
          <button class="ibtn" id="edAI" type="button" title="敌方 AI 的出手速度">AI 普通</button>
          <button class="ibtn" id="edClear" type="button">清空</button>
          <span class="grow"></span>
          <button class="ibtn" id="edImport" type="button">导入</button>
          <button class="ibtn" id="edShare" type="button">分享码</button>
          <button class="ibtn" id="edUpload" type="button" title="上传到关卡大厅（需要先试玩通关）">上传</button>
          <button class="ibtn primary" id="edTest" type="button"><svg viewBox="0 0 12 12"><path d="M4 2.5l5 3.5-5 3.5z"/></svg>试玩</button>
        </div>
      </div>

      <div id="overlay" class="layer hidden"></div>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/codec.js"></script>
<script src="js/endless.js"></script>
<script src="js/editor.js"></script>
<script src="js/lobby.js"></script>
<script src="js/game.js"></script>
</body>
</html>
