<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>菌落触手战</title>
<meta name="description" content="触手战争式的微生物策略游戏：伸出触手、切断触手、占领培养皿里的全部 20 个区域。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: one 640x480 petri-dish stage, letterboxed and scaled to the window; HUD lives inside the stage like the 2011 original. */
:root{
  --abyss:#06110e;         /* page / letterbox */
  --dish:#0c1c18;          /* playfield base */
  --panel:#112222;         /* original BG_COLOR */
  --panel-line:#3f5a52;
  --membrane:#eeeeee;      /* original OUTLINE_COLOR */
  --ink:#e6f0ea;
  --muted:#8ea79c;
  --signal:#ffff55;        /* original highlight yellow */
  --ok:#55ff55;
  --alert:#ff5555;
  --team-green:#33aa33; --team-red:#aa3333; --team-black:#111111; --team-purple:#aa33aa; --team-grey:#888888;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-data:"Chakra Petch","DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--ink);overflow:hidden;}
body{font-family:var(--font-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
#app{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#0d221c 0%,var(--abyss) 70%);}
#stage{position:absolute;left:0;top:0;width:640px;height:480px;transform-origin:0 0;touch-action:none;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #1d3530,0 30px 80px #000c;}
#cv{position:absolute;left:0;top:0;width:640px;height:480px;display:block;}
#ui{position:absolute;inset:0;pointer-events:none;}
#ui .layer{position:absolute;inset:0;}
#ui button,#ui .hit{pointer-events:auto;}
button{font:inherit;color:inherit;}
.hidden{display:none!important;}

/* ---------- HUD ---------- */
#hudTop{position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;gap:14px;padding:0 10px;font-family:var(--font-data);font-size:11px;letter-spacing:.06em;color:#aab9b2;background:linear-gradient(#000a,#0000);}
#hudTop b{color:var(--ink);font-weight:600;}
#hudTop .grow{flex:1;}
#occ{width:96px;height:9px;display:flex;border:1px solid #ffffffb0;background:#0008;}
#occ i{display:block;height:100%;}
#hudBottom{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#0000,#000b);}
#hudBottom .grow{flex:1;}
.ibtn{height:22px;min-width:22px;padding:0 8px;border:1px solid #ffffff38;border-radius:11px;background:#0e2420d0;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-family:var(--font-body);color:#cfe0d8;cursor:pointer;transition:background .15s,border-color .15s;}
.ibtn:hover{background:#18352e;border-color:#ffffff70;}
.ibtn:focus-visible{outline:2px solid var(--signal);outline-offset:1px;}
.ibtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ibtn.off{opacity:.5;}
.ibtn.on{border-color:var(--signal);color:var(--signal);}

#status{position:absolute;left:40px;right:40px;bottom:36px;text-align:center;font-family:var(--font-display);font-size:17px;letter-spacing:.04em;color:#eeeeaa;text-shadow:0 0 8px #000,0 1px 2px #000;transition:opacity .6s;}
#tip{position:absolute;padding:6px 9px;border:1px solid #ffffff40;border-radius:6px;background:#0b1d19e8;font-size:11px;line-height:1.55;white-space:nowrap;transform:translate(-50%,0);font-family:var(--font-body);box-shadow:0 6px 18px #0009;}
#tip .k{color:#9fb3aa;margin-right:4px;}
#tip .v{font-family:var(--font-data);font-weight:600;color:var(--signal);}
.tutor{position:absolute;font-family:var(--font-display);font-size:22px;color:#e8e8e8;text-shadow:0 0 10px #000,0 0 3px #000;transform:translate(-50%,-50%);white-space:nowrap;animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{50%{opacity:.55}}

/* ---------- panels ---------- */
.veil{position:absolute;inset:0;background:#020806b0;display:grid;place-items:center;pointer-events:auto;}
.card{width:300px;padding:22px 22px 18px;background:var(--panel);border:1px solid #556b64;border-radius:4px;box-shadow:0 20px 60px #000d;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:.06em;text-wrap:balance;}
.card .sub{font-family:var(--font-data);font-size:13px;letter-spacing:.08em;color:#cfd9d4;}
.card .sub em{font-style:normal;color:var(--signal);font-weight:600;}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.btn{min-width:110px;height:34px;padding:0 16px;border:1px solid #ffffff55;border-radius:17px;background:#183631;color:var(--ink);font-size:14px;letter-spacing:.08em;cursor:pointer;font-family:var(--font-body);transition:transform .12s,background .15s,border-color .15s;}
.btn:hover{background:#21483f;border-color:#fff;transform:translateY(-1px);}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
.btn.primary{background:#2a7a2a;border-color:#7fdc7f;}
.btn.primary:hover{background:#33952f;}
.help{width:470px;text-align:left;align-items:stretch;gap:8px;padding:18px 22px;}
.help h2{text-align:center;font-size:28px;}
.help ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:12.5px;line-height:1.6;color:#d3e0da;}
.help li{display:grid;grid-template-columns:52px 1fr;gap:8px;}
.help li b{font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--signal);letter-spacing:.04em;}
.help .evo{font-family:var(--font-data);font-size:11px;color:#9fb3aa;letter-spacing:.02em;}
.help .row{justify-content:center;margin-top:4px;}

/* ---------- zone menu ---------- */
#menu .title{position:absolute;left:0;right:0;top:12px;text-align:center;}
#menu .title h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:42px;line-height:1.1;letter-spacing:.12em;color:#f2f6f3;text-shadow:0 0 18px #33aa3366,0 2px 0 #000;}
#menu .title p{margin:2px 0 0;font-family:var(--font-data);font-size:11px;letter-spacing:.42em;color:#c58fd0;text-transform:uppercase;}
.zone{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--membrane);font-family:var(--font-data);font-weight:700;font-size:14px;color:#fff;display:grid;place-items:center;cursor:pointer;text-shadow:0 1px 2px #000;transition:transform .15s,box-shadow .15s;padding:0;}
.zone:hover{transform:scale(1.18);box-shadow:0 0 12px #ffff55aa;}
.zone:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
.zone.done{background:#33aa3380;}
.zone.next{background:#88888899;animation:pulse 1.6s ease-in-out infinite;}
.zone.lock{background:#aa33aa66;border-color:#bbbbbb;color:#e7c9ea;cursor:not-allowed;opacity:.8;}
.zone.lock:hover{transform:none;box-shadow:none;}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffffff18,0 0 16px #ffff5566}}
#menu .center{position:absolute;left:320px;top:284px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;}
#menu .score{font-family:var(--font-data);font-size:11px;letter-spacing:.2em;color:#9fb3aa;}
#menu .score b{display:block;text-align:center;font-size:22px;letter-spacing:.04em;color:var(--signal);}
#menu .center .btn{min-width:96px;height:28px;font-size:12.5px;}
#menu .foot{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10px;color:#7e958b;letter-spacing:.04em;}
#menu .tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;}
@media (prefers-reduced-motion:reduce){.zone.next,.tutor{animation:none}}
#rotateHint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));padding:0 16px;text-align:center;font-size:13px;letter-spacing:.06em;color:#8ea79c;display:none;pointer-events:none;}
#rotateHint svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:1.6;}
@media (orientation:portrait) and (pointer:coarse){#rotateHint{display:block}}
</style>
</head>
<body>
<div id="app">
  <div id="rotateHint"><svg viewBox="0 0 16 16"><rect x="4.5" y="1.5" width="7" height="13" rx="1.5"/><path d="M1.5 9.5a6.5 6.5 0 0 0 4 4.5M14.5 6.5a6.5 6.5 0 0 0-4-4.5"/></svg>把手机横过来玩，培养皿会更大</div>

    <canvas id="cv" width="640" height="480"></canvas>

          <div class="score">总积分<b id="scoreVal">0</b></div>

          <button class="btn" id="btnHelp" type="button">玩法说明</button>
        </div>

          <button class="ibtn" id="mMusic" type="button" title="音乐"></button>

          <button class="ibtn" id="bSpeed" type="button" title="游戏速度">1×</button>
          <button class="ibtn" id="bSound" type="button" title="音效"></button>
          <button class="ibtn" id="bMusic" type="button" title="音乐"></button>

        </div>
      </div>
      <div id="overlay" class="layer hidden"></div>
    </div>
  </div>
</div>
<script>
'use strict';
(() => {

const LEVELS = /*LEVELS*/[[60,100,1,[[2,3,509,148],[3,60,325,241]],[]],[60,100,0,[[3,10,347,328],[2,50,200,299],[3,10,258,154],[3,60,456,161],[3,10,324,228]],[]],[100,100,2,[[3,50,90,331],[2,20,315,315],[1,30,128,165],[1,30,299,107],[1,30,464,161],[1,30,473,319]],[[341,205,264,218],[253,427,210,305],[210,296,256,221]]],[100,100,0,[[2,100,473,242],[3,60,281,245],[3,30,255,398],[3,30,144,359],[3,30,96,245],[3,30,139,141],[3,30,244,93]],[]],[100,100,3,[[3,30,110,160],[3,30,132,287],[3,30,211,387],[1,90,307,205],[5,100,532,101]],[]],[60,100,0,[[3,10,214,184],[3,10,418,186],[2,30,318,346],[1,10,198,357],[1,10,438,359],[3,30,65,313],[3,30,567,319]],[[242,286,304,225],[123,392,150,300],[489,306,511,395],[316,223,390,287],[309,215,309,124]]],[80,100,0,[[3,20,198,338],[2,10,329,348],[3,20,456,342],[4,60,328,231],[2,10,459,234],[2,10,191,227],[2,10,329,111],[3,20,452,118],[3,20,201,116]],[]],[80,100,0,[[3,70,94,377],[1,10,210,308],[1,10,364,334],[1,10,244,165],[2,50,534,96],[1,10,392,191]],[]],[200,100,0,[[3,50,335,389],[3,50,329,84],[3,30,156,248],[3,30,515,244],[1,200,334,243],[5,50,445,128],[5,50,219,367],[5,30,454,366],[5,30,223,136]],[[257,271,257,214],[359,320,308,321],[414,273,414,217],[303,167,356,166]]],[100,100,0,[[3,20,122,330],[3,20,250,330],[3,20,384,330],[3,20,519,330],[2,30,119,150],[2,30,247,150],[2,30,381,150],[2,30,512,150]],[]],[200,100,0,[[3,80,160,100],[2,80,163,373],[4,80,477,106],[5,80,485,372],[1,80,317,235]],[]],[100,100,0,[[3,10,281,229],[3,30,177,318],[5,30,414,230],[5,30,414,321],[5,30,415,134],[3,30,178,143]],[]],[150,100,0,[[3,30,116,242],[3,50,72,347],[5,30,399,392],[5,30,403,86],[3,50,79,126],[5,30,546,142],[5,30,461,246],[5,30,545,345]],[]],[60,100,0,[[5,60,323,124],[2,60,221,293],[5,10,491,135],[3,60,432,297],[2,10,177,140],[3,10,322,407]],[[322,345,322,238],[328,229,417,173],[316,229,233,173]]],[100,100,0,[[3,50,161,275],[3,10,337,81],[2,10,255,395],[4,10,503,274],[2,50,485,146],[4,50,200,135],[1,50,419,392]],[]],[100,100,0,[[3,100,324,343], const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const mix = (c1, c2, t) => [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
const WHITE = [255,255,255], BLACKC = [0,0,0];

// Segment intersection exactly as in Level.getIntersection (open interval on both segments)
function intersect(p1, p2, p3, p4, p5, p6, p7, p8) {
  const d = (p4 - p2) * (p5 - p7) - (p6 - p8) * (p3 - p1);
  if (d === 0) return null;
  const ua = ((p4 - p2) * (p5 - p1) - (p6 - p2) * (p3 - p1)) / d;
  const ub = ((p6 - p2) * (p5 - p7) - (p6 - p8) * (p5 - p1)) / d;
  if (!(ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1)) return null;
  if (ua === 0 || ua === 1 || ub === 0 || ub === 1) return null;
  return { x: p1 + (p3 - p1) * ub, y: p2 + (p4 - p2) * ub };
}

// =====================================================================
//  Audio — synthesized with WebAudio (no samples)
// =====================================================================
const Audio = (() => {
  let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
  let soundOn = true, musicOn = true, music = null;
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = soundOn ? 0.55 : 0; sfxBus.connect(comp);
    musBus = ctx.createGain(); musBus.gain.value = musicOn ? 0.32 : 0; musBus.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (musicOn) startMusic();
    return true;
  }
  function env(g, t, a, peak, dcy) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy); }
  function tone(type, f0, f1, t, dur, vol, dest) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.008, vol, dur); o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, ftype, f0, f1, q) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = ftype; f.Q.value = q || 1;

class Anchor {             // a fixed point on a cell's membrane, 36 buckets of 10°
  constructor(cell, idx) { this.cell = cell; this.idx = idx; this.ang = idx * 10 * Math.PI / 180; }
  get x() { return this.cell.x + Math.cos(this.ang) * this.cell.radius(); }
  get y() { return this.cell.y + Math.sin(this.ang) * this.cell.radius(); }
  rx(a) { return lerp(this.cell.px, this.cell.x, a) + Math.cos(this.ang) * this.cell.radius(); }
  ry(a) { return lerp(this.cell.py, this.cell.y, a) + Math.sin(this.ang) * this.cell.radius(); }
}
class FreeAnchor {         // the meeting point of two opposing tentacles
  constructor(x, y) { this.x = this.px = x; this.y = this.py = y; }
  rx(a) { return lerp(this.px, this.x, a); }
  ry(a) { return lerp(this.py, this.y, a); }
}

class Cell {

  angleTo(c) { return Math.atan2(c.y - this.y, c.x - this.x) * 180 / Math.PI; }

    if (++this.sendAttackCnt > this.attackPeriod) { this.sendAttackCnt = 0; this.sendAttack(); }
  }
}

class Link {

const stage = document.getElementById('stage');

// Field background: an out-of-focus colony seen through a microscope
function paintFieldBg(seed) {

  g.scale(S, S);
  const base = g.createRadialGradient(W * 0.5, H * 0.45, 40, W * 0.5, H * 0.5, W * 0.75);
  base.addColorStop(0, '#16302a'); base.addColorStop(1, '#07130f');

    const n = [70, 55, 26][layer];

      const x = r() * W, y = r() * H, rad = [26, 20, 34][layer] + r() * [22, 16, 26][layer];
      const hue = r();
      const col = hue < 0.6 ? [70, 120, 80] : hue < 0.85 ? [90, 110, 70] : [60, 110, 115];
      const a = [0.035, 0.05, 0.03][layer];

    }

  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);

  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');

}
// Menu background: tangled filaments
function paintMenuBg() {
  const S = 2, c = makeCanvas(W * S, H * S), g = c.getContext('2d'), r = rng(7);
  g.scale(S, S);
  const base = g.createRadialGradient(W / 2, H * 0.55, 30, W / 2, H / 2, W * 0.8);
  base.addColorStop(0, '#1b2d31'); base.addColorStop(1, '#070d0f');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  g.lineCap = 'round';

    for (let i = 0; i < 70; i++) {
      let x = r() * W, y = r() * H, a = r() * Math.PI * 2;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 6; k++) { a += (r() - 0.5) * 1.4; const L = 20 + r() * 40; const nx = x + Math.cos(a) * L, ny = y + Math.sin(a) * L; g.quadraticCurveTo(x + Math.cos(a + 0.6) * L * 0.5, y + Math.sin(a + 0.6) * L * 0.5, nx, ny); x = nx; y = ny; }

let fieldBg = null, menuBg = null;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  stage.style.transform = `translate(${Math.round((vw - W * scale) / 2)}px,${Math.round((vh - H * scale) / 2)}px) scale(${scale})`;
  const pw = Math.round(W * scale * dpr), ph = Math.round(H * scale * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
}
window.addEventListener('resize', resize);

const TAU = Math.PI * 2;
function teamRgb(type) { return TEAM[type].rgb; }

function drawFence(f, t) {
  const dx = f.x2 - f.x1, dy = f.y2 - f.y1, ang = Math.atan2(dy, dx), R = 5, hp = Math.PI / 2;
  const s1 = Math.sin(f.phase) * 5 + 2, s2 = Math.sin(f.phase + Math.PI) + 2;
  const cx = (a, r) => Math.cos(a) * r, cy = (a, r) => Math.sin(a) * r;
  ctx.beginPath();
  ctx.moveTo(cx(ang + hp, R) + f.x1, cy(ang + hp, R) + f.y1);
  ctx.quadraticCurveTo(cx(ang + Math.PI, R) * s2 + f.x1, cy(ang + Math.PI, R) * s2 + f.y1, cx(ang - hp, R) + f.x1, cy(ang - hp, R) + f.y1);
  ctx.quadraticCurveTo(cx(ang - hp, s1) + dx / 2 + f.x1, cy(ang - hp, s1) + dy / 2 + f.y1, cx(ang - hp, R) + f.x2, cy(ang - hp, R) + f.y2);
  ctx.quadraticCurveTo(cx(ang, R) * s2 + f.x2, cy(ang, R) * s2 + f.y2, cx(ang + hp, R) + f.x2, cy(ang + hp, R) + f.y2);
  ctx.quadraticCurveTo(cx(ang + hp, s1) + dx / 2 + f.x1, cy(ang + hp, s1) + dy / 2 + f.y1, cx(ang + hp, R) + f.x1, cy(ang + hp, R) + f.y1);
  ctx.closePath();
  const gr = ctx.createLinearGradient(f.x1 + cx(ang + hp, 8), f.y1 + cy(ang + hp, 8), f.x1 + cx(ang - hp, 8), f.y1 + cy(ang - hp, 8));
  gr.addColorStop(0, '#6c6c3e'); gr.addColorStop(0.5, '#4a4a2a'); gr.addColorStop(1, '#2c2c18');
  ctx.fillStyle = gr; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(238,238,238,0.85)'; ctx.stroke();
  // little spines
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(238,238,210,0.35)';
  const n = Math.max(2, Math.floor(Math.hypot(dx, dy) / 14));
  ctx.beginPath();
  for (let i = 1; i < n; i++) {
    const k = i / n, bx = f.x1 + dx * k, by = f.y1 + dy * k, w = Math.sin(f.phase * 0.7 + i) * 1.5;
    ctx.moveTo(bx + cx(ang + hp, 2), by + cy(ang + hp, 2)); ctx.lineTo(bx + cx(ang + hp, 6 + w), by + cy(ang + hp, 6 + w));
    ctx.moveTo(bx + cx(ang - hp, 2), by + cy(ang - hp, 2)); ctx.lineTo(bx + cx(ang - hp, 6 - w), by + cy(ang - hp, 6 - w));

}

// segment world positions for a link at render-time alpha a
function linkGeometry(l, a) {
  const x1 = l.a1.rx(a), y1 = l.a1.ry(a), x2 = l.a2.rx(a), y2 = l.a2.ry(a);
  const dx = x2 - x1, dy = y2 - y1, dir = Math.atan2(dy, dx), dist = Math.hypot(dx, dy);
  const off = l.growing ? Math.min(SEG_STEP - 0.01, l.segInitOffset + 4 * a) : l.segInitOffset;
  const step = l.attached && l.maxPos > 0 ? (dist - off) / l.maxPos : SEG_STEP;
  const phase = l.wavePhase + WAVE_SPEED * a;
  const perp = dir + Math.PI / 2, cd = Math.cos(dir), sd = Math.sin(dir), cp = Math.cos(perp), sp = Math.sin(perp);
  const n = l.segs.length, pts = new Array(n);

    const loc7 = i >= l.maxPos / 2 ? l.maxPos - i : i;
    const fade = Math.min(1, loc7 * WAVE_FADING);
    let base = off, sgn = 1;
    if (rev) { base += dist; sgn = -1; }
    const wv = Math.sin(phase + i * WAVE_FREQ) * WAVE_SIZE * fade;
    const along = sgn * i * step + base;
    return { x: x1 + cd * along + cp * wv, y: y1 + sd * along + sp * wv, f: fade };
  };

  else {
    for (let i = 0; i <= l.cutPos && i < n; i++) pts[i] = place(i, false);
    for (let i = Math.max(0, l.cutPos + 1); i < n; i++) pts[i] = place(n - i - 1, true);

function drawLink(l, t, a) {
  if (l.segs.length === 0 && !l.growing) return;
  const g = linkGeometry(l, a), pts = g.pts, n = pts.length;
  const rgb = teamRgb(l.orig.type);
  const light = mix(rgb, WHITE, l.orig.type === T.BLACK ? 0.45 : 0.35);
  // spine
  const drawSpine = (from, to) => {
    if (to - from < 1) return;
    ctx.beginPath(); ctx.moveTo(pts[from].x, pts[from].y);
    for (let i = from + 1; i <= to; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const p = pts[i];

function drawBead(x, y, rot, r, fade, rgb, ph, isBlack) {
  const fill = isBlack ? [24, 24, 24] : rgb;
  const rim = isBlack ? [150, 150, 150] : mix(rgb, WHITE, 0.45);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  // cilia
  const cl = 1.5 + fade * 4.2;
  ctx.strokeStyle = rgba(rim, 0.55); ctx.lineWidth = 0.9;
  ctx.beginPath();
  const w = Math.sin(ph) * 0.5;

  ctx.moveTo(0, r * 0.8); ctx.quadraticCurveTo(-cl * 0.2, r + cl * 0.6, -cl * (0.5 - w * 0.4), r + cl);

function membranePath(x, y, R, t, seed) {
  ctx.beginPath();
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    const rr = R + Math.sin(a * 3 + t * 1.3 + seed) * 0.7 + Math.sin(a * 5 - t * 0.9 + seed * 2) * 0.45;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawOrnaments(c, x, y, R, t) {
  const evo = c.evo; if (evo === 0) return;
  const rgb = teamRgb(c.type);
  const orn = c.type === T.BLACK ? [90, 90, 90] : mix(rgb, WHITE, 0.25);
  const rim = c.type === T.BLACK ? [200, 200, 200] : mix(rgb, WHITE, 0.6);
  const spin = t * (0.15 + evo * 0.05) + c.seed;
  const pul = Math.sin(t * 3 + c.seed);
  ctx.save(); ctx.translate(x, y);
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * TAU + (evo >= 4 ? spin : spin * 0.3);
    ctx.save(); ctx.rotate(a);
    const inner = 15.5, room = Math.max(3, R - inner);
    if (evo === 1) {                 // embryo: buds
      const rr = 2 + 0.4 * Math.sin(t * 2.5 + k);
      ctx.beginPath(); ctx.arc(inner + room * 0.55, 0, rr, 0, TAU);
      ctx.fillStyle = rgba(orn, 0.9); ctx.fill(); ctx.lineWidth = 0.8; ctx.strokeStyle = rgba(rim, 0.7); ctx.stroke();
    } else if (evo === 2 || evo === 3) { // pulsars: rays (B with bulbs)
      const len = room * (evo === 2 ? 0.55 : 0.75) * (0.8 + 0.2 * Math.sin(t * 4 + k * (evo === 2 ? 0 : 1.5)));
      ctx.beginPath(); ctx.moveTo(inner - 1, 0); ctx.lineTo(inner + len, 0);

    } else if (evo === 4) {          // ant: jointed legs reaching past the membrane

      ctx.lineTo(jx, jy); ctx.lineTo(jx + Math.cos(bend) * L2, Math.sin(bend) * L2);
      ctx.lineWidth = 1.8; ctx.strokeStyle = rgba(orn, 0.95); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

}

function drawCell(c, t, a, hover, selected) {
  const x = lerp(c.px, c.x, a), y = lerp(c.py, c.y, a), R = c.radius();
  const rgb = teamRgb(c.type), isGrey = c.type === T.GREY, isBlack = c.type === T.BLACK;

  if (hover || selected) {
    const gl = ctx.createRadialGradient(x, y, R * 0.9, x, y, R + 12);
    gl.addColorStop(0, 'rgba(255,255,0,0.45)'); gl.addColorStop(1, 'rgba(255,255,0,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, R + 12, 0, TAU); ctx.fill();
  }

    ctx.fillStyle = rgba(mix(rgb, WHITE, 0.6), c.flash * 0.5); ctx.beginPath(); ctx.arc(x, y, R + 8 * (1 - c.flash) + 4, 0, TAU); ctx.fill();

  const cg = ctx.createRadialGradient(x - 5, y - 6, 1, x, y, 15);
  cg.addColorStop(0, rgba(mix(rgb, WHITE, isBlack ? 0.22 : 0.42), al));
  cg.addColorStop(0.6, rgba(rgb, al)); cg.addColorStop(1, rgba(mix(rgb, BLACKC, 0.35), al));
  ctx.fillStyle = cg; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(238,238,238,0.95)'; ctx.stroke();
  // grey occupation progress
  if (isGrey && c.occPower > 0) {
    const need = Math.max(1, Math.trunc(c.power / GREY_GIVE_UP_DIV));
    const k = clamp(c.occPower / need, 0, 1), orgb = teamRgb(c.occType);
    ctx.beginPath(); ctx.arc(x, y, R + 4, -Math.PI / 2, -Math.PI / 2 + k * TAU);
    ctx.lineWidth = 3; ctx.strokeStyle = rgba(mix(orgb, WHITE, 0.25), 0.95); ctx.lineCap = 'round'; ctx.stroke();
    const pr = 3 + k * 8 + Math.sin(t * 6) * 0.8;
    const pg = ctx.createRadialGradient(x, y, 0, x, y, pr);
    pg.addColorStop(0, rgba(mix(orgb, WHITE, 0.4), 0.9)); pg.addColorStop(1, rgba(orgb, 0.1));

  if (isGrey) {
    ctx.fillStyle = 'rgba(30,30,30,0.85)'; ctx.fillText(String(c.power), x + 0.5, y - 1.5);
    ctx.fillStyle = 'rgba(245,245,225,0.75)'; ctx.fillText(String(c.power), x, y - 2);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(String(c.power), x + 0.6, y - 2.4);
    ctx.fillStyle = '#ffffff'; ctx.fillText(String(c.power), x, y - 3);
    const ml = c.maxLinks, st = 5, x0 = x - (ml * st) / 2 + st / 2;
    for (let i = 0; i < ml; i++) {

function arrowLine(x0, y0, x1, y1, col, width, head) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 2) return;
  ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  if (head) {
    const a = Math.atan2(dy, dx), h = Math.min(12, L * 0.4);
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a - 0.45) * h, y1 - Math.sin(a - 0.45) * h);
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a + 0.45) * h, y1 - Math.sin(a + 0.45) * h);

  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a - 0.5) * 10, y1 - Math.sin(a - 0.5) * 10);
  ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a + 0.5) * 10, y1 - Math.sin(a + 0.5) * 10); ctx.stroke();
  ctx.restore();
}

  setPaused(p, silent) {

  onKey(e) {

  // ---------- input ----------
  toLocal(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; },
  cellAt(x, y, touch) {

    this.pointer = { x: p.x, y: p.y, inside: true, touch };
    try { stage.setPointerCapture(e.pointerId); } catch (_) { }
    const c = this.cellAt(p.x, p.y, touch);

  },
  onUp(e) {

    const d = this.drag; this.drag = null;

      const tgt = this.cellAt(p.x, p.y, touch);

// =====================================================================
//  Main loop
// =====================================================================
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(250, now - lastT); lastT = now;
  const lv = game.lv;
  if (lv && (game.state === 'play' || game.state === 'ending' || game.state === 'end') && !game.paused) {
    acc += dt * (game.state === 'play' ? game.speed : 1);
    let n = 0;
    while (acc >= TICK_MS && n < 12) { lv.tick(); acc -= TICK_MS; n++; }
    if (n >= 12) acc = 0;
    game.lastAlpha = acc / TICK_MS;
  }
  render(now / 1000, game.lastAlpha);
  game.updateTip(now);
  requestAnimationFrame(frame);
}

function render(t, a) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (game.state === 'menu') { renderMenu(t); return; }
  const lv = game.lv;
  ctx.drawImage(fieldBg, 0, 0, W, H);
  if (!lv) return;
  for (const l of lv.links) drawLink(l, t, a);
  for (const f of lv.fences) drawFence(f, t);
  // tutorial arrows (same coordinates as the original bitmaps)
  if (game.tutorial === 0) dashedArrow(362, 222, 485, 162, t);
  if (game.tutorial === 1) dashedArrow(346, 158, 405, 281, t);
  const hv = game.state === 'play' && game.hoverVisible(performance.now());
  for (const c of lv.cells) drawCell(c, t, a, hv && c === game.hover, c === game.selected);
  // gesture
  const d = game.drag, p = game.pointer;
  if (d && game.state === 'play') {
    if (d.mode === 'link' && game.selected) {
      const s = game.selected, tgt = game.hover && game.hover !== s ? game.hover : null;
      const ex = tgt ? tgt.x : p.x, ey = tgt ? tgt.y : p.y;
      const blocked = tgt && lv.blocked(s, tgt);
      ctx.save(); ctx.shadowColor = blocked ? '#000' : 'rgba(255,255,85,0.6)'; ctx.shadowBlur = 8;
      arrowLine(s.x, s.y, ex, ey, blocked ? 'rgba(170,170,170,0.8)' : '#ffff55', 3, true);
      ctx.restore();
      if (tgt) {
        const dist = Math.hypot(tgt.x - s.x, tgt.y - s.y) - s.radius() - tgt.radius();
        let cost = Math.trunc(Math.max(0, dist) / SEG_STEP); if (cost < 5) cost += 1; cost += 1;
        const existing = lv.getLink(tgt, s);
        const label = blocked ? '有墙阻挡' : `需 ${existing && tgt.type !== s.type ? Math.ceil(cost / 2) : cost} 能量`;
        ctx.font = `600 11px ${FONT_DATA}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const mx = (s.x + ex) / 2, my = (s.y + ey) / 2 - 12;
        const tw = ctx.measureText(label).width + 12;
        ctx.fillStyle = 'rgba(8,20,17,0.85)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(mx - tw / 2, my - 9, tw, 18, 9) : ctx.rect(mx - tw / 2, my - 9, tw, 18); ctx.fill();
        ctx.fillStyle = blocked ? '#cccccc' : (cost > s.power ? '#ff7777' : '#ffff88'); ctx.fillText(label, mx, my + 0.5);
      }
    } else if (d.mode === 'cut' && Math.hypot(p.x - d.x0, p.y - d.y0) > 3) {
      ctx.save(); ctx.shadowColor = 'rgba(255,85,85,0.7)'; ctx.shadowBlur = 8;
      arrowLine(d.x0, d.y0, p.x, p.y, '#ff5555', 3, false); ctx.restore();
    }
  }
  const sl = game.slash;
  if (sl) {
    const k = (performance.now() - sl.t) / 260;
    if (k >= 1) game.slash = null;
    else { ctx.save(); ctx.globalAlpha = 1 - k; arrowLine(sl.x0, sl.y0, sl.x1, sl.y1, 'rgba(255,200,200,0.9)', 2 * (1 - k) + 0.5, false); ctx.restore(); }
  }
  const fm = game.flashMsg;
  if (fm) {
    const k = (performance.now() - fm.t) / 1200;
    if (k >= 1) game.flashMsg = null;
    else { ctx.globalAlpha = 1 - k; ctx.font = `15px ${getComputedStyle(document.documentElement).getPropertyValue('--font-display')}`; ctx.fillStyle = '#ffdddd'; ctx.textAlign = 'center'; ctx.fillText(fm.text, fm.x, fm.y - 24 - k * 10); ctx.globalAlpha = 1; }
  }
}

// menu: petri dish with 20 zones around the rim
const menuTendrils = Array.from({ length: ZONES }, (_, i) => ({ dark: Math.random() < 0.5, len: 10 + Math.random() * 12, spot: Math.random() > 0.4, ph: Math.random() * 6 }));
function renderMenu(t) {
  ctx.drawImage(menuBg, 0, 0, W, H);
  const cx = 320, cy = 284, r = 80;
  // dish glow
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, r + 70);
  g.addColorStop(0, 'rgba(51,170,51,0.10)'); g.addColorStop(0.55, 'rgba(51,170,51,0.04)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r + 70, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(10,26,22,0.72)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(238,238,238,0.9)'; ctx.stroke();
  for (let i = 0; i < ZONES; i++) {
    const p = game.zonePos(i);
    ctx.beginPath(); ctx.moveTo(Math.cos(p.ang) * r + cx, Math.sin(p.ang) * r + cy); ctx.lineTo(Math.cos(p.ang) * p.r2 + cx, Math.sin(p.ang) * p.r2 + cy);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(238,238,238,0.8)'; ctx.stroke();
    // wriggling tendril between spokes
    const tt = menuTendrils[i], a0 = p.ang + 10 * Math.PI / 180;
    ctx.beginPath();
    const bx = Math.cos(a0) * r + cx, by = Math.sin(a0) * r + cy; ctx.moveTo(bx, by);
    let px = bx, py = by;
    for (let k = 1; k <= 6; k++) {
      const s = k / 6, w = Math.sin(t * 1.6 + tt.ph + k * 0.9) * 3 * s;
      const along = r + tt.len * s;
      px = Math.cos(a0) * along + cx + Math.cos(a0 + Math.PI / 2) * w; py = Math.sin(a0) * along + cy + Math.sin(a0 + Math.PI / 2) * w;
      ctx.lineTo(px, py);
    }
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = tt.dark ? 'rgba(10,10,10,0.95)' : 'rgba(136,136,136,0.95)'; ctx.stroke();
    if (tt.spot) { ctx.beginPath(); ctx.arc(px, py, 2.2, 0, TAU); ctx.fillStyle = tt.dark ? '#888' : '#ddd'; ctx.fill(); }
  }
  // little drifting microbes inside the dish
  for (let k = 0; k < 5; k++) {
    const a = t * (0.1 + k * 0.03) + k * 1.7, rr = 28 + (k % 3) * 14;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a * 1.3) * rr * 0.6;
    const rgb = [[51, 170, 51], [170, 51, 51], [170, 51, 170], [17, 17, 17], [136, 136, 136]][k];
    ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fillStyle = rgba(rgb, 0.35); ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(238,238,238,0.25)'; ctx.stroke();
  }
}

// =====================================================================
//  Boot
// =====================================================================
resize();
game.init();
const boot = () => { resize(); requestAnimationFrame(frame); };
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => {}); }
boot();
window.__game = game; // handy for debugging from the console
})();
</script>
